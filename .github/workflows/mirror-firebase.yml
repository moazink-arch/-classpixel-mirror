name: Mirror Cloudflare to Firebase

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Download latest Cloudflare site with images
        run: |
          mkdir -p site_content
          cd site_content
          
          # Download the entire site with wget (including page requisites)
          wget --mirror --convert-links --adjust-extension --page-requisites --no-parent \
               --wait=1 --limit-rate=100k \
               --user-agent="GitHub-Mirror-Bot/1.0" \
               https://classpixelgames.com/
          
          # Extract all game thumbnail URLs from HTML files
          echo "Extracting game thumbnail URLs..."
          mkdir -p img/gamemonetize
          
          # Find all HTML files and extract image URLs
          find . -name "*.html" -type f | while read html_file; do
            # Extract all img.gamemonetize.com URLs
            grep -o 'https://img.gamemonetize.com/[^"]*\.jpg' "$html_file" 2>/dev/null | while read img_url; do
              # Generate a clean filename from the URL
              filename=$(echo "$img_url" | sed 's|https://img.gamemonetize.com/||' | sed 's|/|_|g' | sed 's|\.\.\.||g')
              
              # Download the image if it doesn't exist
              if [ ! -f "img/gamemonetize/$filename" ]; then
                echo "Downloading: $img_url"
                wget -q "$img_url" -O "img/gamemonetize/$filename" || echo "Failed: $img_url"
              fi
            done
          done
          
          # Also extract images from the games.html page
          if [ -f "classpixelgames.com/games.html" ]; then
            grep -o 'https://img.gamemonetize.com/[^"]*\.jpg' "classpixelgames.com/games.html" 2>/dev/null | while read img_url; do
              filename=$(echo "$img_url" | sed 's|https://img.gamemonetize.com/||' | sed 's|/|_|g' | sed 's|\.\.\.||g')
              if [ ! -f "img/gamemonetize/$filename" ]; then
                echo "Downloading: $img_url"
                wget -q "$img_url" -O "img/gamemonetize/$filename" || echo "Failed: $img_url"
              fi
            done
          fi
          
          # Update all HTML files to use local image paths
          echo "Updating HTML files to use local image paths..."
          find . -name "*.html" -type f | while read html_file; do
            sed -i 's|https://img.gamemonetize.com/[^"]*\.jpg|/img/gamemonetize/|g' "$html_file"
          done
          
          # Move content out of domain directory
          if [ -d "classpixelgames.com" ]; then
            mv classpixelgames.com/* ./
            rm -rf classpixelgames.com
          fi
          
          # Create a fallback favicon if missing
          echo "Creating fallback files..."
          touch .nojekyll
      
      - name: Deploy to Firebase
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="/tmp/firebase-key.json"
          firebase deploy --only hosting --project classpixel-games
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
